name: Install cargo-deny
description: >-
  cargo-deny's release binary, checksum-verified, into cargo's bin directory. Replaces
  EmbarkStudios/cargo-deny-action, whose Docker image is pulled from Docker Hub anonymously and
  fails on its rate limit on shared runners. Dependabot does not see this pin: bump DENY_VERSION
  and DENY_SHA256 (the release's .sha256 asset) together.

runs:
  using: composite
  steps:
    - name: Install cargo-deny
      shell: bash
      env:
        DENY_VERSION: 0.20.2
        DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
      run: |
        archive="cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl"
        curl -sSfL --retry 3 -o "$RUNNER_TEMP/$archive.tar.gz" \
          "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/$archive.tar.gz"
        echo "$DENY_SHA256  $RUNNER_TEMP/$archive.tar.gz" | sha256sum --check --strict
        tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
        install -D -m 0755 "$RUNNER_TEMP/$archive/cargo-deny" "${CARGO_HOME:-$HOME/.cargo}/bin/cargo-deny"
        cargo deny --version
