name: CI

on:
  push:
    branches: [main]
  pull_request:

# `npm run check` is the single gate: typecheck, lint, the regression tests against
# real shipments, and a production build. It is the same command run locally, so CI
# cannot drift from what a developer sees.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint, test and build
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
