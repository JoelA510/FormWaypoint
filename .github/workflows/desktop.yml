name: Desktop build

# The Windows installer cannot be produced anywhere but a Windows runner, so this is the
# only route to a testable .exe. Runs on demand, and on any push that touches the shell or
# the code it wraps, so a change that breaks packaging is caught here rather than the next
# time someone wants a build.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # The same gate the web build uses. A desktop artifact should never be produced from
      # a tree that fails the suite.
      - name: Typecheck, lint, test and build
        run: npm run check

      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test

      - name: Build the installer
        run: npm run desktop:build

      - name: Upload the installer
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: FormWaypoint-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/FormWaypoint.exe
          if-no-files-found: error
          retention-days: 30
